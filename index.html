<style>
:root{
  --bg:#f6f8fb;--card:#fff;--text:#172033;--muted:#647084;--accent:#1d4ed8;
  --line:#e4e9f0;--shadow:0 18px 45px rgba(23,32,51,.09);
}
body{background:var(--bg);color:var(--text);transition:background .3s,color .3s}
header{position:sticky;top:0;z-index:100;backdrop-filter:blur(14px);background:rgba(255,255,255,.86);border-bottom:1px solid var(--line)}
.theme-toggle{position:relative;z-index:200;border:1px solid var(--line);border-radius:50%;width:42px;height:42px;background:var(--card);color:var(--text);cursor:pointer;font-size:19px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
article,.stat,.career-path>div{transition:transform .28s ease,box-shadow .28s ease,border-color .28s ease}
article:hover,.career-path>div:hover{transform:translateY(-7px);box-shadow:var(--shadow)}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  /*
   * LIVE SHARED ENDORSEMENTS
   * Replace the two placeholders below with your Supabase project values.
   * Never put a Supabase service-role/secret key here.
   */
  const SUPABASE_URL = 'https://uovlojoruumnsklappvc.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_cn-4gWfORpGPwSnkEkBi1A_lKmcr8o2';

  const form=document.getElementById('endorsementForm');
  const list=document.getElementById('endorsementList');
  if(!form||!list)return;

  const ready = SUPABASE_URL.startsWith('https://') &&
                !SUPABASE_URL.includes('YOUR_') &&
                !SUPABASE_ANON_KEY.includes('YOUR_');

  if(!ready){
    list.innerHTML='<div class="empty-endorsements">Live endorsements are ready. Add your Supabase Project URL and publishable key in this file to connect the public database.</div>';
    return;
  }

  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function esc(s){
    return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  }
  function stars(n){return '★'.repeat(n)+'☆'.repeat(5-n)}

  async function render(){
    const {data,error}=await client
      .from('endorsements')
      .select('id,name,area,rating,comment')
      .order('id',{ascending:false});

    if(error){
      list.innerHTML='<div class="empty-endorsements">Unable to load endorsements right now. Please try again later.</div>';
      return;
    }

    const rows=data||[];
    const count=rows.length;
    const avg=count?rows.reduce((a,x)=>a+Number(x.rating),0)/count:0;

    document.getElementById('ratingCount').textContent=count;
    document.getElementById('avgRating').textContent=avg.toFixed(1);
    document.getElementById('summaryStars').textContent=stars(Math.round(avg));

    const bars=document.getElementById('ratingBars');
    bars.innerHTML='';
    for(let r=5;r>=1;r--){
      const n=rows.filter(x=>Number(x.rating)===r).length;
      const pct=count?Math.round(n/count*100):0;
      bars.innerHTML+=`<div class="rating-bar"><span>${r}</span><div class="rating-track"><div class="rating-fill" style="width:${pct}%"></div></div><span>${n}</span></div>`;
    }

    if(!count){
      list.innerHTML='<div class="empty-endorsements">No endorsements yet. Be the first to share a professional rating.</div>';
      return;
    }

    list.innerHTML=rows.map(x=>{
      const date='';
      return `<article class="endorsement-card">
        <div class="endorsement-card-top">
          <div><h3>${esc(x.name)}</h3><div class="endorsement-meta">${esc(x.area)}</div></div>
          <div class="stars">${stars(Number(x.rating))}</div>
        </div>
        <p class="endorsement-comment">${esc(x.comment)}</p>
      </article>`;
    }).join('');
  }

  form.addEventListener('submit',async function(e){
    e.preventDefault();

    const button=form.querySelector('button[type="submit"]');
    const original=button.textContent;
    button.disabled=true;
    button.textContent='Submitting...';

    const entry={
      name:document.getElementById('endorserName').value.trim(),
      area:document.getElementById('endorsementArea').value,
      rating:Number(document.getElementById('endorsementRating').value),
      comment:document.getElementById('endorserComment').value.trim()
    };

    if(!entry.name||!entry.area||!entry.rating||!entry.comment){
      button.disabled=false;
      button.textContent=original;
      return;
    }

    const {error}=await client.from('endorsements').insert(entry);

    if(error){
      console.error('Supabase endorsement insert error:', error);
      alert('Your endorsement could not be submitted.\n\nSupabase: ' + (error.message || 'Unknown database error'));
    }else{
      form.reset();
      await render();
      document.getElementById('endorsementList').scrollIntoView({behavior:'smooth',block:'start'});
    }

    button.disabled=false;
    button.textContent=original;
  });

  render();

  // Live updates: everyone with the page open sees new/changed endorsements.
  client.channel('endorsements-live')
    .on('postgres_changes',
      {event:'*',schema:'public',table:'endorsements'},
      () => render()
    )
    .subscribe();
})();
</script>
